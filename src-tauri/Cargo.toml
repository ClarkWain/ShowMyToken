[package]
name = "show-my-token"
version = "0.1.0"
description = "Cross-platform desktop overlay for live AI agent token usage."
authors = ["Clark Wain"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "show_my_token_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.6"
dirs = "6.0.0"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace"] }
prost = "0.14.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "sync"] }

